name: Build Modded Telegram-iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream Telegram Git Repository'
        required: true
        default: 'https://github.com/TelegramMessenger/Telegram-iOS.git'
      upstream_branch:
        description: 'Upstream Git Branch'
        required: true
        default: 'master'

jobs:
  build:
    name: Build Telegram iOS IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout Mod Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove Android SDKs and toolchains
          sudo rm -rf "$ANDROID_HOME" "$ANDROID_SDK_ROOT" ~/Library/Android /usr/local/share/android-sdk /Library/Android 2>/dev/null || true
          
          # Remove .NET and Mono runtimes
          sudo rm -rf /usr/share/dotnet /usr/local/share/dotnet /Library/Frameworks/Mono.framework 2>/dev/null || true
          
          # Remove older Xcode versions, keeping all Xcode 16.x versions
          for xcode_app in /Applications/Xcode_*.app; do
            if [ -d "$xcode_app" ] && [[ "$xcode_app" != *Xcode_16* ]]; then
              echo "Removing non-Xcode 16: $xcode_app"
              sudo rm -rf "$xcode_app" 2>/dev/null || true
            fi
          done
          
          # Clean caches
          brew cleanup 2>/dev/null || true
          sudo rm -rf /tmp/* ~/Library/Caches/Homebrew 2>/dev/null || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select Xcode 16 Version
        run: |
          XCODE_DIR=""
          for app in $(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V -r); do
            if [ -d "$app/Contents/Developer" ]; then
              XCODE_DIR="$app/Contents/Developer"
              break
            fi
          done
          
          if [ -n "$XCODE_DIR" ]; then
            echo "Selecting Xcode: $XCODE_DIR"
            sudo xcode-select -s "$XCODE_DIR"
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            echo "Selecting default Xcode: /Applications/Xcode.app/Contents/Developer"
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bazel_cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('build_configuration.json', 'patcher.py') }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ hashFiles('build_configuration.json', 'patcher.py') }}-
            bazel-cache-${{ runner.os }}-

      - name: Configure Bazel Global Settings
        run: |
          mkdir -p ~/.bazel_cache
          echo "build --disk_cache=/Users/runner/.bazel_cache" > ~/.bazelrc
          echo "build --local_ram_resources=HOST_RAM*0.8" >> ~/.bazelrc
          echo "build --verbose_failures" >> ~/.bazelrc
          echo "Configured ~/.bazelrc:"
          cat ~/.bazelrc

      - name: Clone Upstream Repository
        run: |
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || 'https://github.com/TelegramMessenger/Telegram-iOS.git' }}"
          UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch || 'master' }}"
          echo "Cloning $UPSTREAM_REPO (branch: $UPSTREAM_BRANCH)..."
          git clone --branch "$UPSTREAM_BRANCH" --depth 1 "$UPSTREAM_REPO" telegram
          cd telegram
          git submodule update --init --recursive --depth 1 -j8

      - name: Apply Mod Patches
        run: |
          python3 patcher.py --repo-path telegram

      - name: Prepare Build Configuration
        run: |
          cp build_configuration.json telegram/build_configuration.json
          echo "build --disk_cache=/Users/runner/.bazel_cache" >> telegram/.bazelrc
          echo "build --local_ram_resources=HOST_RAM*0.8" >> telegram/.bazelrc

      - name: Build IPA with Bazel
        run: |
          cd telegram
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configuration=release_arm64 \
            --buildNumber=10001 \
            --configurationPath=build_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --outputBuildArtifactsPath=artifacts

      - name: Save Bazel Disk Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.bazel_cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('build_configuration.json', 'patcher.py') }}-${{ github.run_id }}

      - name: Upload Modded IPA
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMod-unsigned-ipa
          path: telegram/artifacts/Telegram.ipa
          if-no-files-found: error
